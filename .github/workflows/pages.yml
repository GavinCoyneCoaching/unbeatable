# Publishes the website in gavincoin-site/ to GitHub Pages on every push.
# Live at https://gavincoynecoaching.github.io/unbeatable/ (until a custom domain is added).
name: Publish site

on:
  push:
    branches: [claude/code-landing-pages-43vda4]  # the repo's default branch; GitHub Pages only deploys from it
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy site files (leave out internal notes)
        run: |
          mkdir _site
          cp -r gavincoin-site/. _site/
          rm -f _site/CLAUDE.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
