<svg viewBox="0 0 600 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loopTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="loopTitle">The Distraction Loop: Overwhelm and Nerves leads to Distraction, to Delayed Processing, to Hesitation, to Poor Reaction, to Visible Result, to Frustration, and back to Overwhelm and Nerves.</title>
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#F2C200" />
    </marker>
  </defs>

  <rect x="0" y="0" width="600" height="620" fill="#14304A" />

  <!-- connecting edges -->
  <g stroke="#F2C200" stroke-width="2.25" fill="none" opacity="0.85" marker-end="url(#arrowhead)">
    <path d="M355.9,131.9 L387.6,147.2" />
    <path d="M466.3,238.9 L474.1,273.2" />
    <path d="M451.5,391.9 L429.5,419.4" />
    <path d="M322.6,475.7 L287.4,475.7" />
    <path d="M176.7,427.2 L154.8,399.7" />
    <path d="M123.7,282.9 L131.5,248.6" />
    <path d="M203.4,151.5 L235.1,136.2" />
  </g>

  <!-- break point markers -->
  <g>
    <circle cx="219.2" cy="143.8" r="9" fill="#14304A" stroke="#F2C200" stroke-width="2" />
    <text x="219.2" y="148" text-anchor="middle" font-family="Barlow, sans-serif" font-weight="700" font-size="12" fill="#F2C200">1</text>
    <circle cx="127.6" cy="265.8" r="9" fill="#14304A" stroke="#F2C200" stroke-width="2" />
    <text x="127.6" y="270" text-anchor="middle" font-family="Barlow, sans-serif" font-weight="700" font-size="12" fill="#F2C200">2</text>
  </g>

  <!-- nodes -->
  <g font-family="Barlow, sans-serif" text-anchor="middle">
    <!-- 0 Overwhelm & Nerves -->
    <circle cx="300" cy="105" r="62" fill="#1c3f5e" stroke="#F2C200" stroke-width="1.5" />
    <text x="300" y="98" font-size="14.5" font-weight="600" fill="#ffffff">Overwhelm</text>
    <text x="300" y="116" font-size="14.5" font-weight="600" fill="#ffffff">&amp; Nerves</text>

    <!-- 1 Distraction -->
    <circle cx="452.5" cy="178.4" r="62" fill="#1c3f5e" stroke="#F2C200" stroke-width="1.5" />
    <text x="452.5" y="184" font-size="14.5" font-weight="600" fill="#ffffff">Distraction</text>

    <!-- 2 Delayed Processing -->
    <circle cx="490.1" cy="343.4" r="62" fill="#1c3f5e" stroke="#F2C200" stroke-width="1.5" />
    <text x="490.1" y="336" font-size="14.5" font-weight="600" fill="#ffffff">Delayed</text>
    <text x="490.1" y="354" font-size="14.5" font-weight="600" fill="#ffffff">Processing</text>

    <!-- 3 Hesitation -->
    <circle cx="384.6" cy="475.7" r="62" fill="#1c3f5e" stroke="#F2C200" stroke-width="1.5" />
    <text x="384.6" y="481" font-size="14.5" font-weight="600" fill="#ffffff">Hesitation</text>

    <!-- 4 Poor Reaction -->
    <circle cx="215.4" cy="475.7" r="62" fill="#1c3f5e" stroke="#F2C200" stroke-width="1.5" />
    <text x="215.4" y="469" font-size="14.5" font-weight="600" fill="#ffffff">Poor</text>
    <text x="215.4" y="487" font-size="14.5" font-weight="600" fill="#ffffff">Reaction</text>

    <!-- 5 Visible Result -->
    <circle cx="109.9" cy="343.4" r="62" fill="#1c3f5e" stroke="#F2C200" stroke-width="1.5" />
    <text x="109.9" y="336" font-size="14.5" font-weight="600" fill="#ffffff">Visible</text>
    <text x="109.9" y="354" font-size="14.5" font-weight="600" fill="#ffffff">Result</text>

    <!-- 6 Frustration -->
    <circle cx="147.5" cy="178.4" r="62" fill="#1c3f5e" stroke="#F2C200" stroke-width="1.5" />
    <text x="147.5" y="184" font-size="14.5" font-weight="600" fill="#ffffff">Frustration</text>
  </g>

  <!-- legend -->
  <g font-family="Barlow, sans-serif" font-size="13.5">
    <circle cx="130" cy="575" r="9" fill="#14304A" stroke="#F2C200" stroke-width="2" />
    <text x="130" y="580" text-anchor="middle" font-weight="700" font-size="12" fill="#F2C200">1</text>
    <text x="150" y="580" text-anchor="start" fill="#B9C6D6">Break point — before overwhelm takes hold</text>

    <circle cx="130" cy="600" r="9" fill="#14304A" stroke="#F2C200" stroke-width="2" />
    <text x="130" y="605" text-anchor="middle" font-weight="700" font-size="12" fill="#F2C200">2</text>
    <text x="150" y="605" text-anchor="start" fill="#B9C6D6">Break point — before frustration becomes the next distraction</text>
  </g>
</svg>
